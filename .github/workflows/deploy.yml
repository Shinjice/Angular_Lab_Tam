name: Angular_Lab_Tam

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        run: |
          mkdir -p src/environments

          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            firebase: {
              apiKey: '${{ vars.FIREBASE_API_KEY }}',
              authDomain: '${{ vars.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ vars.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ vars.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ vars.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ vars.FIREBASE_APP_ID }}',
              measurementId: '${{ vars.FIREBASE_MEASUREMENT_ID }}',
            },
          };
          EOF

          echo "Environment file created:"
          cat src/environments/environment.ts

      - name: Verify environment file
        run: |
          test -f src/environments/environment.ts
          test -s src/environments/environment.ts
          echo "environment.ts exists and is not empty"

      - name: Build Angular
        run: npm run build -- --configuration production --base-href /Angular_Lab_Tam/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/Angular_Lab_Tam/browser

      - name: Deploy
        uses: actions/deploy-pages@v4
